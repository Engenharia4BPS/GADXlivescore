services:
  percona57:
    image: percona:5.7.44-48
    environment:
      MYSQL_DATABASE: dxarauca_livescore_test
      MYSQL_USER: ${PERCONA57_TEST_USER:?Set PERCONA57_TEST_USER in the local shell.}
      MYSQL_PASSWORD: ${PERCONA57_TEST_PASSWORD:?Set PERCONA57_TEST_PASSWORD in the local shell.}
      MYSQL_ROOT_PASSWORD: ${PERCONA57_TEST_ROOT_PASSWORD:?Set PERCONA57_TEST_ROOT_PASSWORD in the local shell.}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:33067:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
